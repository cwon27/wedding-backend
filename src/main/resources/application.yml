spring:
  application:
    name: wedding-backend
  config:
    # 로컬에서는 .env 파일 값을 환경 변수처럼 읽는다 (파일이 없어도 오류 없음)
    import: optional:file:.env[.properties]

  datasource:
    # Supabase: Project Settings > Database > Connection string > "Session pooler" (IPv4 지원)
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 5 # Supabase 무료 플랜 연결 수 제한 고려

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate # 테이블은 Flyway 마이그레이션으로만 만든다

  flyway:
    locations: classpath:db/migration
    # Supabase "automatic RLS" 가 public 에 함수(rls_auto_enable)를 만들어 두어서 스키마가 비어 있지 않다.
    # 그 상태를 버전 0 으로 기록하고 V1 부터 적용한다 (baseline-version 을 1 로 두면 V1 이 건너뛰어진다)
    baseline-on-migrate: true
    baseline-version: 0

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

server:
  error:
    include-stacktrace: never
    include-message: never

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174}

  device:
    cookie-name: wg_device
    max-age: 365d
    secure: ${DEVICE_COOKIE_SECURE:false} # 배포(HTTPS)에서는 true

  guestbook:
    max-regenerations: 1 # 기기당 후보 재생성 횟수

  generation:
    candidates: ${CANDIDATE_GENERATOR:fake} # 1단계 사진 → 후보: fake | gemini
    sprite: ${SPRITE_GENERATOR:fake} #         2단계 후보 → 걷기 시트: fake (pixellab 예정)
    worker-delay: 2s
    # 처리 도중 서버가 꺼져 RUNNING 으로 남은 작업 복구 (StaleJobRecovery).
    # stale-after 는 정상 처리 시간(Gemini 타임아웃 120s 등)보다 넉넉히 길게: 짧으면 같은 작업이 두 번 처리된다
    stale-after: 10m
    stale-check-interval: 1m
    gemini:
      api-key: ${GEMINI_API_KEY:}
      model: ${GEMINI_MODEL:gemini-nano-banana-2.1}
      api-revision: "2026-05-20" # 따옴표 없으면 YAML 이 날짜로 읽는다
      timeout: 120s
